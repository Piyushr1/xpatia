baseURL = 'https://xpatia.in/'
languageCode = 'en-us'
title = 'Xpatia'
theme = 'PaperMod'
enableRobotsTXT = true

[params]
  env = "production"
  description = "Location Intelligence Platform for Smart Business Decisions"
  author = "Xpatia"
  
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = false
  tocopen = false

  # Profile Mode (makes homepage look much better)
  [params.profileMode]
    enabled = true
    title = "Xpatia"
    subtitle = "Location Intelligence for Smart Business Decisions"
    imageUrl = "https://via.placeholder.com/400x400/4A90E2/FFFFFF?text=Xpatia"
    imageWidth = 120
    imageHeight = 120
    imageTitle = "Xpatia Logo"
    buttons = [
      {name = "Blog", url = "/posts"},
      {name = "Services", url = "/services"},
      {name = "About", url = "/about"}
    ]

  [params.homeInfoParams]
    Title = "Welcome to Xpatia 👋"
    Content = """
    Making location intelligence accessible to every business.
    
    We help restaurant chains and retail businesses optimize their location strategy through data-backed insights using open-source GIS data.
    """

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://linkedin.com/company/xpatia"
  
  [[params.socialIcons]]
    name = "email"
    url = "mailto:hello@xpatia.in"
  
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/Piyushr1"

  # Cover image settings
  [params.cover]
    hidden = false
    hiddenInList = false
    hiddenInSingle = false

[menu]
  [[menu.main]]
    identifier = "blog"
    name = "Blog"
    url = "/posts/"
    weight = 10
  
  [[menu.main]]
    identifier = "services"
    name = "Services"
    url = "/services/"
    weight = 20
  
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 30
    
  [[menu.main]]
    identifier = "search"
    name = "Search"
    url = "/search/"
    weight = 40

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.highlight]
    anchorLineNos = false
    codeFences = true
    guessSyntax = false
    lineNos = true
